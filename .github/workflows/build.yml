name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 実際の配布対象
          - os: windows-latest
            extra: ""
          # 大文字小文字を区別するファイルシステム。
          # resx の参照パスなどが実ファイル名とずれていると、ここだけが落ちる
          - os: ubuntu-latest
            extra: "-p:EnableWindowsTargeting=true"

    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build (Release)
        # 警告ゼロを維持する。新しい警告が出たら CI を落とす
        run: dotnet build src/team1.sln -c Release -warnaserror ${{ matrix.extra }}
